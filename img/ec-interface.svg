337" y="588" text-anchor="middle" font-family="Helvetica,Arial" font-size="9" font-weight="normal" fill="#1a1d21">4</text><line x1="110.0" y1="594" x2="110.0" y2="665" stroke="#a64b2a" stroke-width="1"/><text x="106.0" y="674" text-anchor="end" font-family="Helvetica,Arial" font-size="9" font-weight="normal" fill="#a64b2a">latch clicks</text><text x="110.0" y="588" text-anchor="middle" font-family="Helvetica,Arial" font-size="9" font-weight="normal" fill="#1a1d21">0</text><text x="110" y="708" text-anchor="start" font-family="Helvetica,Arial" font-size="10" font-weight="normal" fill="#1a1d21">Power and data arrive last, after the fluid seal is made: a half-inserted module is never live.</text><text x="760" y="574" text-anchor="start" font-family="Helvetica,Arial" font-size="10" font-weight="bold" fill="#7a7d82">D — POGO PIN-OUT</text><text x="760" y="600" text-anchor="start" font-family="Helvetica,Arial" font-size="10" font-weight="normal" fill="#1a1d21">1  12 V</text><text x="760" y="616" text-anchor="start" font-family="Helvetica,Arial" font-size="10" font-weight="normal" fill="#1a1d21">2  GND</text><text x="760" y="632" text-anchor="start" font-family="Helvetica,Arial" font-size="10" font-weight="normal" fill="#1a1d21">3  I²C SDA</text><text x="760" y="648" text-anchor="start" font-family="Helvetica,Arial" font-size="10" font-weight="normal" fill="#1a1d21">4  I²C SCL</text><text x="760" y="664" text-anchor="start" font-family="Helvetica,Arial" font-size="10" font-weight="normal" fill="#1a1d21">5  1-Wire ID</text><text x="760" y="680" text-anchor="start" font-family="Helvetica,Arial" font-size="10" font-weight="normal" fill="#1a1d21">6  spare</text><text x="760" y="704" text-anchor="start" font-family="Helvetica,Arial" font-size="9" font-weight="normal" fill="#7a7d82">The 1-Wire EEPROM carries type, serial and service date.</text><text x="760" y="720" text-anchor="start" font-family="Helvetica,Arial" font-size="9" font-weight="normal" fill="#7a7d82">The controller reads it on power-up and refuses an invalid train.</text><line x1="10" y1="736" x2="1113" y2="736" stroke="#1a1d21" stroke-width="1"/>
